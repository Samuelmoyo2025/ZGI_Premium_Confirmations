<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Confirmation Register — Zimnat</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#1B2A39;
    --navy-2:#243547;
    --green:#00A950;
    --green-dark:#00863f;
    --blue:#008AD1;
    --paper:#F7F8F6;
    --paper-2:#FFFFFF;
    --line:#DCE1E0;
    --ink:#1B2A39;
    --ink-soft:#5B6B72;
    --amber:#B8791A;
    --red:#B3261E;
    --radius:10px;
    --serif: "Iowan Old Style", "Georgia", "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SF Mono", "Consolas", "Menlo", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--blue);}

  /* ---------- Shell ---------- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:236px; flex-shrink:0;
    background:var(--paper-2);
    border-right:1px solid var(--line);
    color:var(--ink);
    display:flex; flex-direction:column;
    padding:22px 14px;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:4px 8px 20px 8px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .brand-logo-card img{ height:26px; width:auto; display:block; }
  .brand-text{line-height:1.3;}
  .brand-text .t1{font-size:12.5px; font-weight:600; color:var(--navy);}
  .brand-text .t2{font-size:10.5px; color:var(--ink-soft);}

  .nav{display:flex; flex-direction:column; gap:3px;}
  .nav-label{
    font-size:10.5px; letter-spacing:.04em; color:#9AA7A4;
    padding:14px 10px 6px 10px;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:8px;
    color:var(--ink-soft); text-decoration:none; font-size:13.5px;
    cursor:pointer; border:none; background:transparent;
    width:100%; text-align:left; font-family:var(--sans);
  }
  .nav-item:hover{background:var(--paper); color:var(--navy);}
  .nav-item.active{background:#E1F4E9; color:var(--green-dark); box-shadow: inset 2px 0 0 var(--green);}
  .nav-item svg{width:16px; height:16px; flex-shrink:0; opacity:.85;}

  .sidebar-foot{
    margin-top:auto; padding-top:14px; border-top:1px solid var(--line);
    font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:8px;
  }
  .conn-dot{width:7px; height:7px; border-radius:50%; background:#9AA7A4; flex-shrink:0;}
  .conn-dot.ok{background:var(--green);}
  .conn-dot.bad{background:var(--red);}

  .main{flex:1; min-width:0; padding:34px 40px 60px 40px;}
  .view{max-width:920px; margin:0 auto;}
  .view.wide{max-width:1080px;}
  .page-head{margin-bottom:26px;}
  .page-head h1{
    font-family:var(--serif); font-size:26px; font-weight:600; margin:0 0 6px 0; color:var(--navy);
    letter-spacing:-0.01em;
  }
  .page-head p{margin:0; color:var(--ink-soft); font-size:14px; max-width:62ch; line-height:1.5;}

  /* ---------- Cards / panels ---------- */
  .panel{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
  }
  .panel + .panel{margin-top:16px;}

  /* ---------- Search ---------- */
  .search-row{display:flex; gap:10px;}
  .search-row input[type="text"]{
    flex:1; font-size:16px; padding:13px 16px; border-radius:9px;
    border:1.5px solid var(--line); font-family:var(--sans); color:var(--ink);
    background:#fff;
  }
  .search-row input[type="text"]:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(0,169,80,0.12);}
  .btn{
    font-family:var(--sans); font-size:13.5px; font-weight:600;
    padding:12px 20px; border-radius:9px; border:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .btn-primary{background:var(--green); color:#fff;}
  .btn-primary:hover{background:var(--green-dark);}
  .btn-primary:disabled{background:#A9C9BB; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-danger{background:transparent; color:var(--red); border:1.5px solid #EFD2CF;}
  .btn-danger:hover{background:#FBEEEC;}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:7px;}

  .result-list{margin-top:18px; display:flex; flex-direction:column; gap:8px;}
  .result-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 16px; border:1px solid var(--line); border-radius:9px;
    background:#fff; cursor:pointer;
  }
  .result-item:hover{border-color:var(--green); background:#F4FBF6;}
  .result-item .rname{font-weight:600; font-size:14px; color:var(--navy);}
  .result-item .rmeta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .result-item .ramt{font-family:var(--mono); font-size:14px; color:var(--navy); font-weight:600;}

  .empty-state{
    text-align:center; padding:44px 20px; color:var(--ink-soft);
  }
  .empty-state .es-icon{font-size:26px; margin-bottom:10px;}
  .empty-state h3{margin:0 0 6px 0; font-size:15px; color:var(--navy); font-family:var(--serif); font-weight:600;}
  .empty-state p{margin:0; font-size:13.5px; max-width:44ch; margin:0 auto; line-height:1.55;}

  /* ---------- Certificate ---------- */
  .certificate{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    margin-top:20px;
  }
  .cert-head{
    background:var(--navy);
    color:#fff;
    padding:20px 26px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .cert-head-left{display:flex; align-items:center; gap:12px;}
  .cert-head-logo{
    background:#fff; border-radius:6px; padding:6px 9px;
    display:flex; align-items:center; flex-shrink:0;
  }
  .cert-head-logo img{ height:18px; width:auto; display:block; }
  .cert-head .cert-title{font-family:var(--serif); font-size:16px; letter-spacing:0.02em;}
  .cert-head .cert-sub{font-size:11.5px; color:#9FB3AE; margin-top:3px;}
  .cert-seal{
    width:40px; height:40px; border-radius:50%;
    border:1.5px solid var(--green);
    display:flex; align-items:center; justify-content:center;
    color:var(--green); flex-shrink:0;
  }
  .cert-body{padding:26px;}
  .cert-name{font-family:var(--serif); font-size:22px; color:var(--navy); margin:0 0 18px 0;}
  .cert-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px 24px;}
  .cert-field{border-bottom:1px solid var(--line); padding-bottom:10px;}
  .cert-field .fl{font-size:11px; color:var(--ink-soft); margin-bottom:4px;}
  .cert-field .fv{font-size:14.5px; color:var(--navy); font-weight:600;}
  .cert-field.amount .fv{color:var(--green-dark); font-family:var(--mono); font-size:17px;}
  .cert-field.ri .fv{color:var(--green-dark);}
  .cert-foot{
    padding:16px 26px; background:var(--paper);
    display:flex; justify-content:space-between; align-items:center;
    border-top:1px solid var(--line);
  }
  .cert-foot .period{font-size:11.5px; color:var(--ink-soft);}
  .cert-actions{display:flex; gap:8px;}

  .reply-box{
    margin-top:16px; padding:16px 18px; background:var(--paper);
    border:1px dashed var(--line); border-radius:9px;
    font-size:13px; line-height:1.6; color:var(--ink); white-space:pre-wrap;
    font-family:var(--sans);
  }

  /* ---------- Upload ---------- */
  .drop{
    border:1.5px dashed var(--line); border-radius:10px;
    padding:34px 20px; text-align:center; cursor:pointer;
    background:var(--paper);
  }
  .drop:hover{border-color:var(--green); background:#F4FBF6;}
  .drop input{display:none;}
  .drop .di{font-size:22px; margin-bottom:8px;}
  .drop .dt{font-size:13.5px; color:var(--navy); font-weight:600;}
  .drop .ds{font-size:12px; color:var(--ink-soft); margin-top:4px;}

  .field-row{display:flex; gap:14px; margin-top:16px; flex-wrap:wrap;}
  .field{flex:1; min-width:150px;}
  .field label{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
  .field select, .field input[type=text], .field input[type=number]{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:13.5px; font-family:var(--sans); color:var(--ink); background:#fff;
  }
  .field select:focus, .field input:focus{outline:none; border-color:var(--green);}

  table.preview{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px;}
  table.preview th{
    text-align:left; padding:9px 10px; background:var(--paper);
    border-bottom:1.5px solid var(--line); color:var(--ink-soft); font-weight:600; font-size:11px;
    position:sticky; top:0;
  }
  table.preview td{padding:8px 10px; border-bottom:1px solid var(--line); color:var(--ink);}
  .preview-wrap{max-height:320px; overflow:auto; border:1px solid var(--line); border-radius:8px; margin-top:14px;}

  .tag{
    display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px;
    font-size:11px; font-weight:600; background:#E7F6EC; color:var(--green-dark);
  }
  .tag.warn{background:#FBF1DF; color:var(--amber);}
  .tag.bad{background:#FBEEEC; color:var(--red);}

  .step-note{font-size:12.5px; color:var(--ink-soft); margin-top:10px; line-height:1.5;}
  .divider{height:1px; background:var(--line); margin:20px 0;}

  /* ---------- History ---------- */
  .hist-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; border:1px solid var(--line); border-radius:9px; background:#fff;
  }
  .hist-row + .hist-row{margin-top:8px;}
  .hist-row .hname{font-weight:600; font-size:14px; color:var(--navy);}
  .hist-row .hmeta{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  /* ---------- Settings ---------- */
  .conn-banner{
    display:flex; align-items:center; gap:10px;
    padding:12px 16px; border-radius:9px; margin-bottom:18px; font-size:13px;
  }
  .conn-banner.ok{background:#E7F6EC; color:var(--green-dark);}
  .conn-banner.bad{background:#FBEEEC; color:var(--red);}
  .conn-banner.pending{background:#FBF1DF; color:var(--amber);}
  code.inline{background:var(--paper); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-family:var(--mono); font-size:12px;}
  .sql-box{
    background:var(--navy); color:#DCE9E4; padding:16px; border-radius:9px;
    font-family:var(--mono); font-size:11.5px; line-height:1.6; overflow-x:auto;
    white-space:pre;
  }
  ol.setup-steps{padding-left:20px; font-size:13.5px; line-height:1.9; color:var(--ink);}
  ol.setup-steps li{margin-bottom:4px;}

  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--navy); color:#fff;
    padding:13px 20px; border-radius:9px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,0.2);
    display:flex; align-items:center; gap:10px; z-index:50;
    animation:slideIn .25s ease-out;
  }
  .toast.error{background:var(--red);}
  @keyframes slideIn{from{transform:translateY(10px); opacity:0;} to{transform:translateY(0); opacity:1;}}

  .spinner{
    width:15px; height:15px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:760px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:12px;}
    .brand{border:none; margin:0; padding:0 10px 0 0;}
    .nav{flex-direction:row;}
    .nav-label{display:none;}
    .sidebar-foot{display:none;}
    .main{padding:22px 16px 50px 16px;}
    .cert-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-logo-card">
        <img id="sidebarLogo" alt="Zimnat General Insurance">
      </div>
      <div class="brand-text">
        <div class="t1">Premium Register</div>
        <div class="t2">Minisure / Alertsure</div>
      </div>
    </div>
    <div class="nav">
      <div class="nav-label">CLAIMS</div>
      <button class="nav-item" data-view="confirm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
        Confirm a premium
      </button>
      <div class="nav-label">FINANCE</div>
      <button class="nav-item" data-view="upload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        Upload a bord
      </button>
      <button class="nav-item" data-view="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
        Bord history
      </button>
      <div class="nav-label">SYSTEM</div>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 01-4 0v-.09A1.7 1.7 0 008.6 19a1.7 1.7 0 00-1.87.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 010-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.33-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 008.6 4.6a1.7 1.7 0 001-1.55V3a2 2 0 014 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9a1.7 1.7 0 001.55 1H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.51 1z"/></svg>
        Settings
      </button>
    </div>
    <div class="sidebar-foot">
      <span class="conn-dot" id="sideConnDot"></span>
      <span id="sideConnText">Checking connection…</span>
    </div>
  </div>

  <div class="main">
    <div id="viewRoot"></div>
  </div>
</div>

<div id="toastRoot"></div>

<script src="logo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
